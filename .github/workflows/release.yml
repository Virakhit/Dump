name: Windows release
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: dump-release
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt
      - run: npm ci
      - name: Require the release signing key and matching version
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing.' }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -notmatch ('^v' + [regex]::Escape($version) + '(-alpha\.[0-9]+)?$')) { throw 'The tag must match the application version.' }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features updater-tests --test updater --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: node --test scripts/publish-update.test.cjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Dump ${{ github.ref_name }}
          releaseBody: 'Windows x64 installer with signed in-app updates. Preview releases remain alpha; Windows publisher signing and physical-machine validation are still pending.'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-alpha.') }}
          updaterJsonPreferNsis: true
          args: --locked
  announce:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/publish-update.test.cjs
      - uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/publish-update.cjs')({ github, context });
